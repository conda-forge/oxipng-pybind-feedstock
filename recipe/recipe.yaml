schema_version: 1

context:
  version: "10.2.1.post1"

package:
  name: oxipng-pybind
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/oxipng-pybind/oxipng_pybind-${{ version }}.tar.gz
  sha256: 0948a74ce2d445bb20c88251bfb5133db854bf2168cb4dd8d9b3239714e65ba3

build:
  number: 0
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
  host:
    - python
    - maturin >=1.8,<2.0
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - oxipng
      pip_check: true

about:
  summary: Focused Python wrapper for oxipng.
  license: Unlicense
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/pdomain/oxipng-pybind

extra:
  recipe-maintainers:
    - thewchan
